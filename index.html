<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tik Tok Toy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  
  body {
    min-height: 100vh;
    background: #050510;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .page {
    display: none;
    text-align: center;
    padding: 20px;
    max-width: 450px;
    width: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.5s ease;
    height: 100vh;
  }
  .page.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ===== GAME TITLE ===== */
  h1.game-title {
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 0 0 10px #ff0050, 0 0 20px #ff0050, 0 0 30px #00f2ea;
    margin-bottom: 25px;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: titlePulse 2s infinite alternate;
  }

  @keyframes titlePulse {
    from { text-shadow: 0 0 10px #ff0050, 0 0 20px #ff0050, 0 0 30px #00f2ea; }
    to { text-shadow: 0 0 20px #ff0050, 0 0 40px #ff0050, 0 0 50px #00f2ea; }
  }

  /* ===== GAME BOARD ===== */
  .game-container {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 0 auto;
    background: #000;
    border: 2px solid #00f2ea;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 242, 234, 0.3);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    touch-action: none;
  }

  .cell {
    border: 2px solid #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    font-weight: bold;
    cursor: pointer;
    position: relative;
    user-select: none;
    transition: background 0.2s;
  }
  .cell:hover { background: rgba(255,255,255,0.05); }

  /* Neon X and O */
  .x-mark { color: #ff0050; text-shadow: 0 0 10px #ff0050, 0 0 20px #ff0050; }
  .o-mark { color: #00f2ea; text-shadow: 0 0 10px #00f2ea, 0 0 20px #00f2ea; }

  /* ===== CUTTING LINE CANVAS ===== */
  #drawCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }
  
  .drawing-active #drawCanvas { pointer-events: auto; cursor: crosshair; }

  /* Glowing Win Line */
  .win-line {
    position: absolute;
    background: #fff;
    box-shadow: 0 0 15px #fff, 0 0 30px #00f2ea, 0 0 50px #00f2ea;
    z-index: 15;
    height: 6px;
    border-radius: 5px;
    transform-origin: left center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .win-line.show { opacity: 1; }

  /* ===== CONGRATULATIONS OVERLAY ===== */
  .win-ui {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(5, 5, 16, 0.95);
    padding: 30px 20px;
    border-radius: 20px;
    border: 2px solid #00f2ea;
    box-shadow: 0 0 50px rgba(0, 242, 234, 0.4);
    display: none;
    flex-direction: column;
    align-items: center;
    width: 90%;
    max-width: 350px;
    z-index: 100;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .win-ui.active {
    display: flex;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .congrats-title {
    font-size: 1.8rem;
    color: #00f2ea;
    text-shadow: 0 0 15px #00f2ea, 0 0 30px #00f2ea;
    margin-bottom: 10px;
    animation: pulse 1.5s infinite alternate;
  }
  
  @keyframes pulse {
    from { transform: scale(1); text-shadow: 0 0 10px #00f2ea, 0 0 20px #00f2ea; }
    to { transform: scale(1.05); text-shadow: 0 0 20px #00f2ea, 0 0 40px #00f2ea; }
  }

  .congrats-sub {
    color: #aaa;
    margin-bottom: 20px;
    font-size: 0.95rem;
    line-height: 1.4;
  }

  /* Play Again Button (Popup ke andar) */
  #popupPlayAgainBtn {
    background: linear-gradient(90deg, #ff0050, #00f2ea);
    color: #fff;
    border: none;
    padding: 10px 25px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 0 15px rgba(0, 242, 234, 0.5);
    display: block; /* Hamesha dikhega */
  }
  #popupPlayAgainBtn:hover { transform: scale(1.05); }

  /* ===== WIN PAGE 2 (Empty Screen with Left Corner Lock) ===== */
  .lock-btn {
    position: absolute;
    bottom: 30px;
    left: 30px;
    background: transparent;
    color: #666;
    border: 2px solid #333;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lock-btn:hover {
    color: #00f2ea;
    border-color: #00f2ea;
    box-shadow: 0 0 15px rgba(0, 242, 234, 0.4);
  }

  /* Chhota sa Restart Button */
  #restartBtn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #333;
    color: #666;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
    z-index: 50;
  }
  #restartBtn:hover {
    background: #ff0050;
    color: #fff;
    border-color: #ff0050;
  }
</style>
</head>
<body>

<!-- ============ PAGE 1: GAME + CONGRATS ============ -->
<div class="page active" id="gamePage">
  
  <h1 class="game-title">Tik Tok Toy Stylist GUI</h1>

  <div class="game-container" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
    
    <canvas id="drawCanvas"></canvas>
    <div class="win-line" id="winLine"></div>
  </div>

  <!-- CONGRATULATIONS OVERLAY -->
  <div class="win-ui" id="winUI">
    <h2 class="congrats-title">🎉 Congratulations! 🎉</h2>
    <p class="congrats-sub" id="congratsMsg">👌</p>
    
    <!-- Play Again Button (Har baar dikhega) -->
    <button id="popupPlayAgainBtn">🔄 Play Again</button>
  </div>

</div>

<!-- ============ PAGE 2: SECRET WEBSITE (Left Corner) ============ -->
<div class="page" id="winPage">
  <a href="https://sachintour2003-cmyk.github.io/UpdatedData/" target="_blank" class="lock-btn">
    🔒 Lock Your Device
</a>
    🔒 Lock Your Device
  </a>
</div>

<!-- Reset button -->
<button id="restartBtn" title="Reset">↻</button>

<script>
/* ================= GAME LOGIC ================= */
const board = document.getElementById('board');
const cells = document.querySelectorAll('.cell');
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const winLineEl = document.getElementById('winLine');
const restartBtn = document.getElementById('restartBtn');
const winUI = document.getElementById('winUI');
const congratsMsg = document.getElementById('congratsMsg');
const popupPlayAgainBtn = document.getElementById('popupPlayAgainBtn');

let boardState = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "X";
let gameActive = true;
let isDrawing = false;
let drawingFinished = false;
let pathPoints = [];

// Normal win conditions
const allWinConditions = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
  [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
  [0, 4, 8], [2, 4, 6]             // Diagonals
];

// Secret condition for Website (Only bottom row)
const secretWinCondition = [6, 7, 8];

function resizeCanvas() {
  canvas.width = board.clientWidth;
  canvas.height = board.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

/* ================= SWIPE & CUT EVENTS ================= */
board.addEventListener('mousedown', startSwipe);
board.addEventListener('mousemove', moveSwipe);
board.addEventListener('mouseup', endSwipe);
board.addEventListener('mouseleave', endSwipe);

board.addEventListener('touchstart', startSwipe, {passive: false});
board.addEventListener('touchmove', moveSwipe, {passive: false});
board.addEventListener('touchend', endSwipe);

function startSwipe(e) {
  if (!drawingFinished) return;
  e.preventDefault();
  isDrawing = true;
  pathPoints = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  handleMove(e);
}

function moveSwipe(e) {
  if (!isDrawing) return;
  e.preventDefault();
  handleMove(e);
}

function endSwipe() {
  if (!isDrawing) return;
  isDrawing = false;
  
  if (pathPoints.length > 2) {
    evaluateCut();
  }
}

function handleMove(e) {
  if (!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;

  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  const x = clientX - rect.left;
  const y = clientY - rect.top;

  ctx.lineTo(x, y);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00f2ea';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);

  pathPoints.push({x, y});
}

/* ================= CUT EVALUATION LOGIC ================= */
function evaluateCut() {
  const start = pathPoints[0];
  const end = pathPoints[pathPoints.length - 1];
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  
  let angle = Math.abs(Math.atan2(dy, dx) * 180 / Math.PI);
  if (angle > 90) angle = 180 - angle; 

  const isHorizontal = angle < 25;

  setTimeout(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isHorizontal) {
      // SAHI CUT! Ab Page 2 (Website) par jao
      document.getElementById('gamePage').classList.remove('active');
      document.getElementById('winPage').classList.add('active');
      document.getElementById('restartBtn').style.display = 'none';
      winUI.classList.remove('active');
    } else {
      // GALAT CUT! Game reset karo (wapas start se)
      resetGame();
    }
  }, 300);
}

/* ================= GAMEPLAY ================= */
function handleCellClick(e) {
  if (!gameActive) return;
  const cell = e.target;
  const index = parseInt(cell.getAttribute('data-index'));

  if (boardState[index] !== "") return;

  boardState[index] = currentPlayer;
  cell.textContent = currentPlayer;
  cell.classList.add(currentPlayer === 'X' ? 'x-mark' : 'o-mark');

  checkWinner();
}

function checkWinner() {
  let roundWon = false;
  let currentWinCombo = null;

  for (let i = 0; i < allWinConditions.length; i++) {
    const [a, b, c] = allWinConditions[i];
    if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
      roundWon = true;
      currentWinCombo = allWinConditions[i];
      break;
    }
  }

  if (roundWon) {
    gameActive = false;
    showWinningLine(currentWinCombo);
    winUI.classList.add('active'); 

    if (currentWinCombo.join(',') === secretWinCondition.join(',')) {
      drawingFinished = true; 
      board.classList.add('drawing-active'); 
      congratsMsg.textContent = "(👌)";
    } else {
      congratsMsg.textContent = "👌";
    }
    return;
  }

  if (!boardState.includes("")) {
    setTimeout(resetGame, 500);
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
}

function showWinningLine(combo) {
  const firstCell = cells[combo[0]];
  const lastCell = cells[combo[2]];

  const rect1 = firstCell.getBoundingClientRect();
  const rect2 = lastCell.getBoundingClientRect();
  const boardRect = board.getBoundingClientRect();

  const x1 = rect1.left - boardRect.left + rect1.width / 2;
  const y1 = rect1.top - boardRect.top + rect1.height / 2;
  const x2 = rect2.left - boardRect.left + rect2.width / 2;
  const y2 = rect2.top - boardRect.top + rect2.height / 2;

  const length = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
  const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  
  winLineEl.style.width = length + 'px';
  winLineEl.style.left = x1 + 'px';
  winLineEl.style.top = y1 + 'px';
  winLineEl.style.transform = `rotate(${angle}deg)`; 
  winLineEl.classList.add('show');
}

/* ================= RESET GAME ================= */
function resetGame() {
  boardState = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = true;
  drawingFinished = false;
  pathPoints = [];
  
  winUI.classList.remove('active');
  document.getElementById('restartBtn').style.display = 'flex';
  
  board.classList.remove('drawing-active');
  winLineEl.classList.remove('show');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  cells.forEach(cell => {
    cell.textContent = "";
    cell.classList.remove('x-mark', 'o-mark');
  });
}

/* ================= EVENT LISTENERS ================= */
cells.forEach(cell => cell.addEventListener('click', handleCellClick));
restartBtn.addEventListener('click', resetGame);
popupPlayAgainBtn.addEventListener('click', resetGame); 

// Initialize
window.onload = () => {
  resizeCanvas();
  resetGame();
};
</script>
</body>
</html>
